x-app: &app
  image: localhost/g2r2-voc:1
  pull_policy: never
  working_dir: /app
  environment:
    POSTGRES_HOST: db
    POSTGRES_DB: voc
    POSTGRES_USER: voc
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,${VOC_SERVER_IP:?Set VOC_SERVER_IP in .env}
    MEDIA_ROOT: /media/uploads
  volumes:
    - ${VOC_ROOT:-/src/voc_web}/manage.py:/app/manage.py:ro,z
    - ${VOC_ROOT:-/src/voc_web}/config:/app/config:ro,z
    - ${VOC_ROOT:-/src/voc_web}/voc:/app/voc:ro,z
    - ${VOC_ROOT:-/src/voc_web}/templates:/app/templates:ro,z
    - ${VOC_ROOT:-/src/voc_web}/static:/app/static:ro,z
    - media:/media/uploads:U

services:
  db:
    image: docker.io/library/postgres:16-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: voc
      POSTGRES_USER: voc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "voc", "-d", "voc"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--threads", "2", "--timeout", "120", "config.wsgi:application"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/login', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 15

  nginx:
    image: localhost/g2r2-voc-nginx:1
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${VOC_PORT:-8989}:443"
    volumes:
      - ${VOC_ROOT:-/src/voc_web}/static:/usr/share/nginx/html/static:ro,z
      - ${VOC_ROOT:-/src/voc_web}/deploy/compose-nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ${VOC_ROOT:-/src/voc_web}/.runtime/tls:/etc/voc-tls:ro,z

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.83.0/24
          gateway: 10.89.83.1

volumes:
  db-data:
  media:
