{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block mainclass %}auth{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>로그인</h1>
  <p class="sub">사내 계정으로 VOC 관리실에 접속하세요.</p>
  <form class="stack" method="post">{% csrf_token %}<label>계정명<input name="username" value="{{ request.POST.username }}" required autocomplete="username" autofocus></label><label>비밀번호<input type="password" name="password" required autocomplete="current-password"></label><button class="primary">로그인</button></form>
  <p class="auth-link">계정이 없으신가요? <a href="/signup">회원가입</a></p>
</section>
{% endblock %}
